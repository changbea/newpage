name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Scaffold fresh React Native project
        run: npx --yes react-native@0.73.6 init URLToQRCode --version 0.73.6 --skip-install

      - name: Copy in App code
        run: |
          rm -f URLToQRCode/App.tsx
          cp source/App.tsx URLToQRCode/App.tsx

      - name: Install dependencies (base + QR code libs)
        working-directory: URLToQRCode
        run: |
          npm install
          npm install react-native-qrcode-svg@6.3.2 react-native-svg@14.1.0

      - name: Make gradlew executable
        working-directory: URLToQRCode
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: URLToQRCode
        run: |
          cd android
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: URLToQRCode/android/app/build/outputs/apk/release/app-release.apk
